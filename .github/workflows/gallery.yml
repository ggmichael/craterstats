name: Build Gallery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/craterstats/config/demo_commands.txt'
      - 'scripts/make_gallery.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install pip
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install -U -r requirements.txt

      - name: Install Craterstats
        run: |
          python setup.py install

      - name: Set Git user name and email
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate and publish gallery.md
        run: |
          python scripts/make_gallery.py
          cp docs/gallery.md "$RUNNER_TEMP/gallery.md"

          git fetch origin gallery || true
          if git show-ref --verify --quiet refs/remotes/origin/gallery; then
            git checkout -B gallery origin/gallery
          else
            git checkout -B gallery
          fi

          mkdir -p docs
          cp "$RUNNER_TEMP/gallery.md" docs/gallery.md
          git add -f docs/gallery.md
          git commit -m "Build gallery.md" || echo "No changes to commit"
          git push origin gallery

      - name: List files after generating gallery
        run: |
          ls -R gallery
